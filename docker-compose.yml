# Local SQL Server for development. Start with `docker compose up -d` after running scripts/dev-setup.sh.
# The image is amd64-only; on Apple Silicon, Docker Desktop runs it under Rosetta (see ADR-0009).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: civicbudget-sql
    # SQL Server under Rosetta occasionally segfaults (exit 139). Let Docker bring it straight back;
    # the app's DatabaseInitializer retries for a minute, and the data volume is untouched.
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run scripts/dev-setup.sh to create .env}
    ports:
      - "127.0.0.1:1433:1433" # this machine only: the sa login is not for the network
    volumes:
      - civicbudget-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  civicbudget-mssql:
