version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      efcore:
        patterns: ["Microsoft.EntityFrameworkCore*", "Microsoft.Extensions.*", "Microsoft.AspNetCore.*"]
      tests:
        patterns: ["xunit*", "bunit*", "Testcontainers*", "coverlet*", "Microsoft.NET.Test.Sdk"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
