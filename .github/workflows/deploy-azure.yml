# Deploys the live demo to Azure Container Apps after CI passes on main: build the image, check it,
# push it to GitHub's registry, and point the Container App and the nightly reset job at the new tag.
# Signs in to Azure with OIDC (no stored credentials); scripts/azure-setup.sh creates the federated
# identity and sets the three secrets and the AZURE_DEPLOY variable this workflow keys on.
name: deploy-azure

on:
  # After CI, not beside it: a commit whose tests fail must not go live.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # the OIDC token for Azure
  contents: read
  packages: write   # push to ghcr.io

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  RESOURCE_GROUP: civicbudget-rg
  APP_NAME: civicbudget-app
  JOB_NAME: civicbudget-reset
  # The commit CI tested (a workflow_run runs on the default branch's latest commit otherwise).
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # The image is built after every green CI run on main whether or not Azure is set up, so the package exists
  # (and can be made public) before scripts/azure-setup.sh creates the Container App that pulls it.
  image:
    # A green CI run on main, or a manual run from main; never another branch's code.
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned 2026-09-23
        with:
          ref: ${{ env.SHA }}

      # GHCR names are lowercase; github.repository keeps the owner's capitalization.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The GitHub Actions cache backend needs the buildx driver, not the default docker one.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3, pinned 2026-09-23

      - name: Log in to GitHub's container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0, pinned 2026-09-24.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built into the local Docker first and checked before anything is pushed, so a broken image
      # never becomes :latest (the tag scripts/azure-setup.sh deploys).
      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6, pinned 2026-09-23
        with:
          context: .
          load: true
          tags: ${{ steps.name.outputs.image }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The one file whose absence makes every interactive page silently dead (see the Dockerfile).
      - name: Check the image serves the Blazor script
        run: docker run --rm --entrypoint sh "${{ steps.name.outputs.image }}:${{ env.SHA }}" -c "test -f wwwroot/_framework/blazor.web.js && grep -q blazor.web CivicBudget.Web.staticwebassets.endpoints.json"

      - name: Push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6, pinned 2026-09-23
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ env.SHA }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha

  deploy:
    # Skips cleanly until setup has run, so a push to a fork or before setup is a no-op.
    if: ${{ vars.AZURE_DEPLOY == 'true' }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-demo
    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2, pinned 2026-09-23
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the site to the new image
        run: |
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.image.outputs.image }}:${{ env.SHA }}" --output none
          echo "url=https://$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_OUTPUT"
        id: site

      - name: Point the nightly reset at the same image
        run: |
          az containerapp job update --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.image.outputs.image }}:${{ env.SHA }}" --output none

      # The old revision keeps serving until the new one is ready, so /health alone could be answered
      # by the old image. Wait until the revision just created is the latest ready one, then check it
      # answers.
      - name: Wait for the new revision to be ready
        run: |
          latest=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          for i in $(seq 1 30); do
            ready=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.latestReadyRevisionName -o tsv)
            if [ "$ready" = "$latest" ] && curl -fsS --max-time 20 "${{ steps.site.outputs.url }}/health" > /dev/null; then
              echo "Revision $latest is ready: ${{ steps.site.outputs.url }}"; exit 0
            fi
            sleep 10
          done
          echo "Revision $latest did not become ready within five minutes; check its logs:"
          az containerapp revision show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$latest" --query "properties.{running:runningState,health:healthState}" -o table
          exit 1
