name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write        # test-reporter publishes a check run with the results
  pull-requests: write # ...and a summary comment on PRs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      # Integration tests start SQL Server 2022 via Testcontainers; Docker is preinstalled on ubuntu runners.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: test results
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # The CDK app synthesizes without credentials: this proves cdk.json, the C# app, and the
  # templates are sound on every change, even though nothing deploys (ADR-0008). The assertion
  # tests in tests/CivicBudget.Infra.Tests already ran above; this is the CLI path a deploy uses.
  cdk-synth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build the CDK app
        run: dotnet build infra/CivicBudget.Infra --configuration Release
      - name: cdk synth
        working-directory: infra/CivicBudget.Infra
        run: npx --yes aws-cdk@2 synth --quiet
        env:
          CDK_DEFAULT_REGION: us-east-2
      - name: Docker image builds
        run: docker build -t civicbudget:ci .
