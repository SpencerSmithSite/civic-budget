name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write        # test-reporter publishes a check run with the results
  pull-requests: write # ...and a summary comment on PRs

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces the old run; on main every commit's run finishes, because the deploy
  # waits for it (deploy-azure runs on CI's completion).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned 2026-09-23

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6, pinned 2026-09-23
        with:
          global-json-file: global.json

      # Packages change only when a project file or the central versions do.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, pinned 2026-09-23
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      # Integration tests start SQL Server 2022 via Testcontainers; Docker is preinstalled on ubuntu runners.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3, pinned 2026-09-23
        if: ${{ !cancelled() }}
        with:
          name: test results
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, pinned 2026-09-23
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # The CDK app synthesizes without credentials: this proves cdk.json, the C# app, and the
  # templates are sound on every change, even though nothing deploys (ADR-0008). The assertion
  # tests in tests/CivicBudget.Infra.Tests already ran above; this is the CLI path a deploy uses.
  # The Azure template compiles and lints, so a typo in infra/azure cannot wait for a deploy to surface.
  bicep-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned 2026-09-23
      - name: bicep build
        run: |
          # A fixed release checked against its published digest, like the SHA-pinned actions: the
          # same Bicep that built the template locally, not whatever "latest" is today.
          curl -fsSL https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64 -o bicep
          echo "64c345a58e0c3e48b1bc98a4e62d6b3adb1d238281297de3400aeafb2697aa5a  bicep" | sha256sum --check
          chmod +x bicep
          ./bicep build infra/azure/main.bicep --stdout > /dev/null
          ./bicep lint infra/azure/main.bicep

  cdk-synth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned 2026-09-23
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6, pinned 2026-09-23
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, pinned 2026-09-23
        with:
          node-version: 22
      - name: Build the CDK app
        run: dotnet build infra/CivicBudget.Infra --configuration Release
      - name: cdk synth
        working-directory: infra/CivicBudget.Infra
        run: npx --yes aws-cdk@2 synth --quiet
        env:
          CDK_DEFAULT_REGION: us-east-2
      - name: Docker image builds
        run: docker build -t civicbudget:ci .
