name: security

# Code scanning and the dependency check, on every change and once a week, so a new advisory for
# a package already in use surfaces even when nobody pushes (docs/security/vulnerability-management.md).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 10 * * 1" # Mondays, 10:17 UTC

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # uploads findings to the repository's code scanning alerts
    strategy:
      fail-fast: false
      matrix:
        # C# and the few browser scripts; build-mode none reads the source without compiling it,
        # so the scan needs no SDK or database and finishes in a few minutes.
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  # Restore already fails on a known vulnerability (NuGetAudit in Directory.Build.props). This job
  # repeats the check on the weekly schedule and prints the report where a reviewer can read it.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Known-vulnerable packages
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::A package has a known vulnerability; see the report above."
            exit 1
          fi
