# The whole application in containers: the same SQL Server as docker-compose.yml plus the app
# image built from ./Dockerfile. This is the one-command demo and the closest local stand-in for
# the AWS shape (app container + managed SQL Server). Start with:
#
#   docker compose -f docker-compose.full.yml up --build
#
# then open http://localhost:8080. The app migrates and seeds on start (Database:MigrateOnStartup
# and Database:SeedDemoData) because this is a demo; a real deployment runs migrations as a step.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: civicbudget-sql
    # SQL Server under Rosetta occasionally segfaults (exit 139). Let Docker bring it straight back;
    # the app's DatabaseInitializer retries for about two minutes, and the data volume is untouched.
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run scripts/dev-setup.sh to create .env}
    ports:
      - "127.0.0.1:1433:1433" # this machine only: the sa login is not for the network
    volumes:
      - civicbudget-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: .
    image: civicbudget:local
    container_name: civicbudget-web
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The same pieces ECS injects in AWS: host and name as settings, the password as a secret.
      Database__Host: sqlserver
      Database__Name: CivicBudget
      Database__User: sa
      Database__Password: ${MSSQL_SA_PASSWORD}
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "true"
      Seed__DemoPassword: ${DEMO_PASSWORD:?Run scripts/dev-setup.sh to create .env}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  civicbudget-mssql:
